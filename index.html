<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Familie Christofori</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%230A0A0A'/%3E%3Ctext x='32' y='44' font-family='Arial Black,Arial' font-weight='900' font-size='34' fill='%23FFD400' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">
<style>
  :root{ --y:#FFD400; --k:#0A0A0A; --ink:#d8dde3; --dim:#8a96a3; --line:#2a2f35; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--k); color:var(--ink); overflow:hidden;
    font-family:"Inter","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  }
  a{color:inherit;text-decoration:none}

  /* Leuchtspur-EKG im Hintergrund (wie EchoWP-Sim Standby) */
  #ecg,#head{position:fixed;inset:0;width:100%;height:100%;opacity:.4;pointer-events:none}

  .screen{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}

  /* Kopfzeile */
  .top{display:flex;align-items:center;justify-content:space-between;gap:2vw;padding:3vh 2.5vw 0;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:.6vw}
  .brand .wm,.brand .wb{font-family:"Inter Display",Inter,"Segoe UI Black","Arial Black",sans-serif;font-weight:900}
  .brand .wm{font-size:clamp(22px,5vh,48px);color:var(--y)}
  .brand .wb{font-size:clamp(16px,3.4vh,34px);background:var(--y);color:var(--k);padding:.5vh .7vw;border-radius:1vh}
  .zulu{display:flex;gap:2.2vw;align-items:center;font-variant-numeric:tabular-nums}
  .zulu div{text-align:right}
  .zulu small{display:block;font-size:clamp(10px,1.5vh,14px);letter-spacing:.2em;color:var(--dim)}
  .zulu b{font-size:clamp(18px,3.4vh,34px);color:var(--y);font-weight:700;letter-spacing:.04em}

  /* Wetter */
  .wx{display:flex;align-items:center;gap:.9vw;font-variant-numeric:tabular-nums}
  .wx svg{width:clamp(34px,6vh,58px);height:clamp(34px,6vh,58px);flex:none}
  .wx small{display:block;font-size:clamp(10px,1.5vh,14px);letter-spacing:.2em;color:var(--dim)}
  .wx b{font-size:clamp(18px,3.4vh,34px);color:var(--y);font-weight:700}
  .wx span{display:block;font-size:clamp(11px,1.6vh,15px);color:var(--ink)}
  .wx[hidden]{display:none}

  /* Mitte */
  .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;padding:0 2.5vw}
  .time{font-size:min(22vh,16vw);font-weight:700;color:var(--y);font-variant-numeric:tabular-nums;letter-spacing:.02em;line-height:1}
  .date{font-size:clamp(16px,4.2vh,40px);color:var(--ink);margin-top:1.5vh}

  .links{display:flex;flex-wrap:wrap;justify-content:center;gap:1.2vh 1vw;margin-top:5vh;max-width:1200px;max-height:34vh;overflow:auto;padding:4px}
  .links a{
    display:flex;flex-direction:column;min-width:150px;padding:1.2vh 1.2vw;border-radius:1vh;
    background:rgba(10,10,10,.75);border:1px solid var(--line);backdrop-filter:blur(2px);
    transition:background .15s,color .15s,border-color .15s;
  }
  .links a b{font-size:clamp(14px,2.1vh,20px);font-weight:700;color:#fff}
  .links a small{font-size:clamp(11px,1.5vh,14px);color:var(--dim);margin-top:2px}
  .links a:hover,.links a:focus-visible{background:var(--y);border-color:var(--y);outline:none}
  .links a:hover b,.links a:focus-visible b{color:var(--k)}
  .links a:hover small,.links a:focus-visible small{color:#333}

  /* Suchzeile unten */
  .bottom{padding:0 2.5vw 3.5vh;display:flex;flex-direction:column;align-items:center;gap:1.2vh}
  form.search{
    width:min(760px,100%);display:flex;border-radius:999px;overflow:hidden;
    background:rgba(10,10,10,.85);border:2px solid var(--y);box-shadow:0 0 24px rgba(255,212,0,.18);
  }
  form.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#fff;padding:1.6vh 22px;font-size:clamp(15px,2.1vh,20px)}
  form.search input::placeholder{color:var(--dim)}
  form.search button{border:0;cursor:pointer;background:var(--y);color:var(--k);font-weight:800;padding:0 26px;font-size:clamp(14px,1.9vh,18px)}
  .hint{font-size:clamp(10px,1.4vh,13px);color:#5d6670}
  .hint a{color:#5d6670}
  .hint a:hover{color:var(--y)}

  @media (max-width:640px){
    body{overflow:auto}
    .top{justify-content:center}
    .wx{width:100%;justify-content:center}
    .zulu{width:100%;justify-content:center}
    .zulu div{text-align:center}
    .links a{min-width:calc(50% - 8px)}
    .links{max-height:none}
    .brand .wm{font-size:28px} .brand .wb{font-size:19px;padding:4px 8px}
    .date{font-size:19px;text-align:center}
    .zulu b{font-size:20px}
  }
</style>
</head>
<body>
<canvas id="ecg"></canvas><canvas id="head"></canvas>

<div class="screen">
  <header class="top">
    <div class="brand"><span class="wm">Familie</span><span class="wb">Christofori</span></div>
    <div class="wx" id="wx" hidden aria-live="polite">
      <svg id="wxIcon" viewBox="0 0 64 64" aria-hidden="true"></svg>
      <div><small>MÜHLACKER</small><b id="wxTemp">--°</b><span id="wxText"></span></div>
    </div>
    <div class="zulu" aria-label="Zulu-Zeit">
      <div><small>ZULU</small><b id="zulu">--:--:--Z</b></div>
      <div><small>DTG</small><b id="dtg">------Z --- --</b></div>
    </div>
  </header>

  <main class="center">
    <div class="time" id="time">--:--:--</div>
    <div class="date" id="date"></div>
    <nav class="links" id="links" aria-label="Links"></nav>
  </main>

  <footer class="bottom">
    <form class="search" action="https://www.google.com/search" method="get" role="search">
      <input type="search" name="q" placeholder="Mit Google suchen …" aria-label="Google-Suche" autocomplete="off" autofocus>
      <button type="submit">Suchen</button>
    </form>
    <div class="hint">familie-christofori.de · <a href="admin.html">Verwaltung</a></div>
  </footer>
</div>

<script>
const $ = id => document.getElementById(id);
const MON = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
const p2 = n => String(n).padStart(2, "0");

// ---------- Kalenderwoche nach ISO 8601 (Woche beginnt Montag, KW 1 enthält den ersten Donnerstag)
function isoWeek(d){
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
  return Math.ceil(((t - Date.UTC(t.getUTCFullYear(), 0, 1)) / 864e5 + 1) / 7);
}
// ---------- Uhr: Ortszeit, Zulu, Datum-Zeit-Gruppe
function clock(){
  const d = new Date();
  $("time").textContent = d.toLocaleTimeString("de-DE");
  $("date").textContent = d.toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long",year:"numeric"}) + " · KW " + isoWeek(d);
  $("zulu").textContent = `${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())}:${p2(d.getUTCSeconds())}Z`;
  // DTG nach NATO-Schema: TTHHMMZ MON JJ
  $("dtg").textContent = `${p2(d.getUTCDate())}${p2(d.getUTCHours())}${p2(d.getUTCMinutes())}Z ${MON[d.getUTCMonth()]} ${String(d.getUTCFullYear()).slice(-2)}`;
}
clock(); setInterval(clock, 1000);

// ---------- Links aus links.json (in der Verwaltung gepflegt)
const FALLBACK = [
  {title:"Wetter",sub:"Deutscher Wetterdienst",url:"https://www.dwd.de"},
  {title:"tagesschau",sub:"Nachrichten",url:"https://www.tagesschau.de"}
];
function safeUrl(u){ try{ const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : null; }catch(e){ return null; } }
function renderLinks(list){
  const nav = $("links"); nav.textContent = "";
  list.forEach(l => {
    const href = safeUrl(l.url); if (!href || !l.title) return;
    const a = document.createElement("a");
    a.href = href; a.target = "_blank"; a.rel = "noopener";
    const b = document.createElement("b"); b.textContent = l.title; a.appendChild(b);
    if (l.sub){ const s = document.createElement("small"); s.textContent = l.sub; a.appendChild(s); }
    nav.appendChild(a);
  });
}
fetch("links.json?v=" + Date.now(), {cache:"no-store"})
  .then(r => r.ok ? r.json() : Promise.reject())
  .then(d => renderLinks(Array.isArray(d) ? d : FALLBACK))
  .catch(() => renderLinks(FALLBACK));


// ---------- Wetter Mühlacker (Open-Meteo, ohne Schlüssel), alle 15 Minuten
const Y = "#FFD400";
const SUN  = `<circle cx="32" cy="32" r="11" fill="${Y}"/><g stroke="${Y}" stroke-width="4" stroke-linecap="round">
  <path d="M32 6v7M32 51v7M6 32h7M51 32h7M13.6 13.6l5 5M45.4 45.4l5 5M13.6 50.4l5-5M45.4 18.6l5-5"/></g>`;
const MOON = `<path d="M40 10a22 22 0 1 0 14 34A18 18 0 0 1 40 10z" fill="${Y}"/>`;
const CLOUD = (dx=0, dy=0) => `<path transform="translate(${dx} ${dy})" d="M18 48h28a10 10 0 0 0 0-20 14 14 0 0 0-27-3A11 11 0 0 0 18 48z"
  fill="#0A0A0A" stroke="${Y}" stroke-width="4" stroke-linejoin="round"/>`;
const SMALLSUN = `<circle cx="22" cy="22" r="8" fill="${Y}"/><g stroke="${Y}" stroke-width="3.5" stroke-linecap="round">
  <path d="M22 5v5M5 22h5M10 10l3.5 3.5M34 10l-3.5 3.5M10 34l3.5-3.5"/></g>`;
const SMALLMOON = `<path d="M26 6a14 14 0 1 0 9 22A11 11 0 0 1 26 6z" fill="${Y}"/>`;
const lines = (d) => `<g stroke="${Y}" stroke-width="4" stroke-linecap="round">${d}</g>`;
const ICON = {
  clear:  day => day ? SUN : MOON,
  partly: day => (day ? SMALLSUN : SMALLMOON) + CLOUD(4, 4),
  cloudy: () => CLOUD(0, -2),
  fog:    () => lines('<path d="M10 22h44M6 32h52M10 42h44M16 52h32"/>'),
  rain:   () => CLOUD(0, -8) + lines('<path d="M22 48l-3 8M32 48l-3 8M42 48l-3 8"/>'),
  snow:   () => CLOUD(0, -8) + `<g fill="${Y}"><circle cx="21" cy="52" r="3"/><circle cx="32" cy="56" r="3"/><circle cx="43" cy="52" r="3"/></g>`,
  storm:  () => CLOUD(0, -8) + `<path d="M34 42l-8 11h7l-4 9 11-13h-7l4-7z" fill="${Y}"/>`
};
function wmo(c){
  if (c === 0) return ["clear","Klar"];
  if (c === 1) return ["partly","Überwiegend klar"];
  if (c === 2) return ["partly","Teils bewölkt"];
  if (c === 3) return ["cloudy","Bedeckt"];
  if (c === 45 || c === 48) return ["fog","Nebel"];
  if (c >= 51 && c <= 57) return ["rain","Niesel"];
  if ((c >= 61 && c <= 67) || (c >= 80 && c <= 82)) return ["rain", c >= 80 ? "Schauer" : "Regen"];
  if ((c >= 71 && c <= 77) || c === 85 || c === 86) return ["snow","Schnee"];
  if (c >= 95) return ["storm","Gewitter"];
  return ["cloudy","–"];
}
function weather(){
  fetch("https://api.open-meteo.com/v1/forecast?latitude=48.95&longitude=8.84&current=temperature_2m,weather_code,is_day,wind_speed_10m&timezone=Europe%2FBerlin", {cache:"no-store"})
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(d => {
      const c = d.current, [k, txt] = wmo(c.weather_code);
      $("wxIcon").innerHTML = ICON[k](c.is_day === 1);
      $("wxTemp").textContent = Math.round(c.temperature_2m) + "°C";
      $("wxText").textContent = `${txt} · Wind ${Math.round(c.wind_speed_10m)} km/h`;
      $("wx").hidden = false;
    })
    .catch(() => {});   // bei Fehler Wetter einfach ausblenden
}
weather(); setInterval(weather, 15 * 60 * 1000);

// ---------- Leuchtspur-EKG (nach EchoWP-Sim Standby): Sinusrhythmus 60/min
const gauss = (x, m, s) => Math.exp(-((x - m) ** 2) / (2 * s * s));
const ecgVal = t => { const x = t % 1;
  return 0.13*gauss(x,.18,.025) - 0.12*gauss(x,.355,.008) + 1.0*gauss(x,.38,.011) - 0.28*gauss(x,.405,.01) + 0.3*gauss(x,.66,.05); };
const g = { cv:$("ecg"), hv:$("head"), ctx:null, hctx:null, last:0, x:-1, y:0, t:0 };
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function frame(ts){
  requestAnimationFrame(frame);
  const cv = g.cv, dpr = window.devicePixelRatio || 1;
  const W = Math.round(cv.clientWidth * dpr), H = Math.round(cv.clientHeight * dpr);
  if (cv.width !== W || cv.height !== H){
    cv.width = g.hv.width = W; cv.height = g.hv.height = H;
    g.ctx = cv.getContext("2d"); g.hctx = g.hv.getContext("2d"); g.x = -1;
  }
  const c = g.ctx, now = ts / 1000;
  if (!g.last){ g.last = now; return; }
  const dt = Math.min(0.1, now - g.last); g.last = now;
  c.globalCompositeOperation = "destination-out";
  c.fillStyle = `rgba(0,0,0,${1 - Math.pow(0.03, dt / 1.5)})`;
  c.fillRect(0, 0, W, H);
  c.globalCompositeOperation = "source-over";
  const sweep = 7;
  c.lineCap = "round"; c.lineJoin = "round";
  c.strokeStyle = "#FFD400"; c.shadowColor = "#FFD400";
  c.lineWidth = 3 * dpr; c.shadowBlur = 18 * dpr;
  c.beginPath();
  const steps = Math.max(1, Math.round(dt * 240));
  for (let i = 1; i <= steps; i++){
    g.t += dt / steps;
    const x = (g.t % sweep) / sweep * W, y = H * 0.5 - ecgVal(g.t) * H * 0.22;
    if (g.x < 0 || x < g.x) c.moveTo(x, y); else { c.moveTo(g.x, g.y); c.lineTo(x, y); }
    g.x = x; g.y = y;
  }
  c.stroke(); c.shadowBlur = 0;
  const gap = W * 0.7;
  c.clearRect(g.x + 6 * dpr, 0, gap, H);
  if (g.x + gap > W) c.clearRect(0, 0, g.x + gap - W, H);
  const h = g.hctx; h.clearRect(0, 0, W, H);
  h.shadowColor = "#FFD400"; h.shadowBlur = 32 * dpr; h.fillStyle = "#fff6c2";
  h.beginPath(); h.arc(g.x, g.y, 5 * dpr, 0, Math.PI * 2); h.fill();
}
if (!reduce) requestAnimationFrame(frame);
</script>
</body>
</html>
